    <span>MARCAÇÃO DE SPAN</span>
    <section>MARCAÇÃO DE SECTION</section>

    <a href="">MARCAÇÃO DE ÂNCORA</a>

    <!-- 
    --- comportamento nativo 
    inline : sao marcacoes cujo espaco ocupa somente seu conteudo, ou seja,
    varias marcacoes inlines aparecem em uma linha so
    block  : sao marcacoes cujo espaco ocupa a linha inteira, e nao so seu conteudo.
    -->
